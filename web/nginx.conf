# upcomarr-web. Serves /srv/site, the generator's output volume, mounted read-only:
#   /srv/site/current      the published build (a relative symlink into builds/)
#   /srv/site/status.json  the last run's result, served as /_status.json
# Nothing else in the volume (builds/ in general, posters/, .state/) is reachable.
#
# add_header in a location replaces every header inherited from the server block, so each
# location includes headers.conf itself.

server_tokens off;

map $request_method $upcomarr_method_ok {
    GET 1;
    HEAD 1;
    default 0;
}

server {
    listen 8080 default_server;
    server_name _;
    root /srv/site/current;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    autoindex off;
    client_max_body_size 1k;
    error_page 404 /404.html;

    include /etc/nginx/upcomarr/headers.conf;

    if ($upcomarr_method_ok = 0) {
        return 405;
    }

    location = /_status.json {
        alias /srv/site/status.json;
        default_type application/json;
        include /etc/nginx/upcomarr/headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Dotfiles (the generator writes none into a build, but never serve one).
    location ~ /\. {
        return 404;
    }

    # Posters are named by a hash of their contents, so they never change.
    location ^~ /p/ {
        location ~ /\. {
            return 404;
        }
        include /etc/nginx/upcomarr/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Assets are linked with ?v=<hash of their contents>.
    location ~ \.(?:css|js|svg)$ {
        include /etc/nginx/upcomarr/headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/upcomarr/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
