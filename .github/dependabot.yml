version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/web"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Stay on Python 3.13 until a deliberate move; 3.14 is tested in CI already.
      - dependency-name: python
        versions: [">=3.14"]
